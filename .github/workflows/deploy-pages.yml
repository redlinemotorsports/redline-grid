name: Deploy Redline Grid to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Build production site
        run: npm run build

      - name: Verify Vite output
        run: |
          test -s dist/index.html
          if grep -Eq 'src=["'\''"]?\./src/[^"'\''"]+\.ts' dist/index.html; then
            echo "Production HTML still references raw TypeScript source files."
            exit 1
          fi
          grep -Eq 'assets/[^"'\''"]+\.js' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed HTML and JavaScript assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.PAGE_URL;
          if (!base) throw new Error("GitHub Pages did not return a deployment URL.");

          const page = await fetch(base);
          if (!page.ok) throw new Error(`Page returned HTTP ${page.status}`);
          const html = await page.text();

          const scripts = [...html.matchAll(/<script\\b[^>]*\\bsrc=["']([^"']+)["'][^>]*>/gi)]
            .map((match) => match[1]);

          if (scripts.length === 0) {
            throw new Error("Deployed page contains no external JavaScript bundles.");
          }

          for (const source of scripts) {
            if (/\\.ts(?:$|\\?)/i.test(source)) {
              throw new Error(`Deployed page still references raw TypeScript: ${source}`);
            }
            const assetUrl = new URL(source, base);
            const asset = await fetch(assetUrl);
            if (!asset.ok) {
              throw new Error(`JavaScript asset failed: ${assetUrl} (HTTP ${asset.status})`);
            }
          }

          console.log(`PASS: deployed page and ${scripts.length} JavaScript bundle(s) are reachable.`);
          NODE
